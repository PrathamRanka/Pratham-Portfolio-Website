name: Pull request automation

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: ["Quality checks"]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      pull_request:
        description: "Pull request number to evaluate"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pull-request-automation-${{ github.event.pull_request.number || github.event.workflow_run.id || github.event.inputs.pull_request }}
  cancel-in-progress: true

jobs:
  repair-known-dependency-failures:
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.name == 'Quality checks') ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check whether this is the known ESLint incompatibility
        id: scope
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            let pullRequest = context.payload.workflow_run?.pull_requests?.[0];
            if (!pullRequest && context.eventName === 'schedule') {
              const { data: openPullRequests } = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                per_page: 100,
              });
              for (const candidate of openPullRequests) {
                if (candidate.user.login !== 'dependabot[bot]' || candidate.draft) continue;
                const { data: checks } = await github.rest.checks.listForRef({
                  owner,
                  repo,
                  ref: candidate.head.sha,
                  per_page: 100,
                });
                const hasFailedQuality = checks.check_runs.some((check) =>
                  check.name === 'validate' && check.conclusion === 'failure');
                if (hasFailedQuality) {
                  pullRequest = candidate;
                  break;
                }
              }
            }
            if (!pullRequest) {
              core.setOutput('repairable', 'false');
              return;
            }

            const { data: details } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullRequest.number,
            });
            const { data: files } = await github.rest.pulls.listFiles({
              owner,
              repo,
              pull_number: pullRequest.number,
              per_page: 100,
            });
            const allowed = new Set(['package.json', 'package-lock.json']);
            const onlyDependencyFiles = files.length > 0 &&
              files.every(({ filename }) => allowed.has(filename));
            const isEslintUpdate = /^chore\(deps-dev\): bump eslint from /i.test(details.title);
            const sameRepository = details.head.repo?.full_name === `${owner}/${repo}`;
            const repairable = details.user.login === 'dependabot[bot]' &&
              !details.draft &&
              onlyDependencyFiles &&
              isEslintUpdate &&
              sameRepository;
            core.setOutput('repairable', repairable ? 'true' : 'false');
            core.setOutput('branch', details.head.ref);
            core.setOutput('pull-number', String(pullRequest.number));

            if (!repairable) {
              core.info('This failed dependency pull request is outside the known repair scope.');
            }

      - name: Check out the dependency pull request
        if: steps.scope.outputs.repairable == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.scope.outputs.branch }}
          fetch-depth: 0

      - name: Set up Node.js
        if: steps.scope.outputs.repairable == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Repair the known ESLint incompatibility
        if: steps.scope.outputs.repairable == 'true'
        run: node scripts/repair-dependency-pr.mjs

      - name: Commit and push the dependency repair
        if: steps.scope.outputs.repairable == 'true'
        env:
          PR_BRANCH: ${{ steps.scope.outputs.branch }}
          PR_NUMBER: ${{ steps.scope.outputs.pull-number }}
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency repair was necessary for #${PR_NUMBER}."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix: keep eslint within supported range"
          git push origin "HEAD:${PR_BRANCH}"

  repair-generated-profile:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check whether the change is safe to repair
        id: scope
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pullNumber = context.payload.pull_request.number;
            const { data: files } = await github.rest.pulls.listFiles({
              owner,
              repo,
              pull_number: pullNumber,
              per_page: 100,
            });
            const allowed = new Set([
              'package.json',
              'package-lock.json',
              'public/llms.txt',
            ]);
            const unsafe = files.filter(({ filename }) => !allowed.has(filename));
            core.setOutput('repairable', unsafe.length === 0 ? 'true' : 'false');
            if (unsafe.length > 0) {
              core.info(`Skipping repair because the PR changes: ${unsafe.map(({ filename }) => filename).join(', ')}`);
            }

      - name: Check out the dependency pull request
        if: steps.scope.outputs.repairable == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        if: steps.scope.outputs.repairable == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Repair generated profile
        if: steps.scope.outputs.repairable == 'true'
        run: npm run update:llms

      - name: Commit generated profile repair
        if: steps.scope.outputs.repairable == 'true'
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- public/llms.txt; then
            echo "public/llms.txt is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/llms.txt
          git commit -m "chore: refresh generated llms profile"
          git push origin "HEAD:${PR_BRANCH}"

  enable-safe-auto-merge:
    if: >-
      (github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'dependabot[bot]') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate checks and enable auto-merge
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            let pullNumber = context.payload.pull_request?.number;

            if (!pullNumber && context.eventName === 'workflow_run') {
              const pullRequests = context.payload.workflow_run.pull_requests || [];
              pullNumber = pullRequests[0]?.number;
            }

            if (!pullNumber && context.eventName === 'workflow_dispatch') {
              pullNumber = Number(context.payload.inputs.pull_request);
            }

            const pullNumbers = pullNumber ? [pullNumber] : [];
            if (context.eventName === 'schedule') {
              const { data: openPullRequests } = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                per_page: 100,
              });
              pullNumbers.push(...openPullRequests
                .filter((pullRequest) => pullRequest.user.login === 'dependabot[bot]' && !pullRequest.draft)
                .map((pullRequest) => pullRequest.number));
            }

            if (pullNumbers.length === 0) {
              core.info('No eligible pull requests are associated with this event.');
              return;
            }

            for (const currentPullNumber of [...new Set(pullNumbers)]) {
              const { data: pullRequest } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: currentPullNumber,
              });

              if (pullRequest.user.login !== 'dependabot[bot]' || pullRequest.draft) continue;

              const { data: checks } = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: pullRequest.head.sha,
                per_page: 100,
              });
              const requiredChecks = ['validate', 'links'];
              const checkByName = new Map(checks.check_runs.map((check) => [check.name, check]));
              const missing = requiredChecks.filter((name) => !checkByName.has(name));
              const unsuccessful = requiredChecks.filter((name) => {
                const check = checkByName.get(name);
                return check && (check.status !== 'completed' ||
                  !['success', 'neutral', 'skipped'].includes(check.conclusion));
              });

              if (missing.length > 0 || unsuccessful.length > 0) {
                core.info(`#${currentPullNumber}: waiting for required checks. Missing: ${missing.join(', ') || 'none'}; not successful: ${unsuccessful.join(', ') || 'none'}.`);
                continue;
              }

              if (pullRequest.mergeable_state !== 'clean') {
                if (pullRequest.mergeable_state === 'dirty') {
                  try {
                    await github.rest.pulls.updateBranch({
                      owner,
                      repo,
                      pull_number: currentPullNumber,
                      expected_head_sha: pullRequest.head.sha,
                    });
                    core.info(`#${currentPullNumber}: requested a Dependabot branch update; waiting for fresh checks.`);
                  } catch (error) {
                    core.warning(`#${currentPullNumber}: could not update the branch automatically. ${error.message}`);
                  }
                }
                core.info(`#${currentPullNumber}: pull request is not clean (${pullRequest.mergeable_state}).`);
                continue;
              }

              try {
                await github.graphql(`
              mutation EnablePullRequestAutoMerge($pullRequestId: ID!) {
                enablePullRequestAutoMerge(
                  input: {
                    pullRequestId: $pullRequestId
                    mergeMethod: SQUASH
                  }
                ) {
                  pullRequest {
                    number
                    autoMergeRequest {
                      mergeMethod
                    }
                  }
                }
              }
            `, { pullRequestId: pullRequest.node_id });
                core.info(`Enabled squash auto-merge for #${currentPullNumber}.`);
              } catch (error) {
                            if (pullRequest.mergeable_state === 'clean') {
                              const merged = await github.rest.pulls.merge({
                                owner,
                                repo,
                                pull_number: currentPullNumber,
                                merge_method: 'squash',
                                commit_title: `${pullRequest.title} (#${currentPullNumber})`,
                              });
                              if (merged.data.merged) {
                                core.info(`#${currentPullNumber}: auto-merge was unavailable, so the verified clean PR was squash-merged directly.`);
                                continue;
                              }
                            }
                            core.warning(`#${currentPullNumber}: could not enable or execute auto-merge. Check repository settings and workflow token permissions. ${error.message}`);
                          }
            }
