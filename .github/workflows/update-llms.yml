name: Update LLM profile

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: update-llms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-llms:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Update LLM profile
        run: node scripts/update-llms.mjs

      - name: Commit changes
        run: |
          if git diff --quiet -- public/llms.txt; then
            echo "public/llms.txt is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/llms.txt
          git commit -m "chore: update llms profile"
          git push
